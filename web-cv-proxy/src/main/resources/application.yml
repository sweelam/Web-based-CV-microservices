server:
  port: 8081

spring:
  application:
    name: api-gateway
  main:
    allow-circular-references: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
          - Path=/api/auth/**
        - id: cv-service
          uri: lb://cv-service
          predicates:
          - Path=/api/cv/**
        - id: auth-server
          uri: lb://auth-server
          predicates:
          - Path=/oauth/**
          - Cookie=mycookie,mycookievalue

eureka:
  client:
    fetchRegistry: true
    register-with-eureka: true
    registryFetchIntervalSeconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    leaseRenewalIntervalInSeconds: 10
    prefer-ip-address: true
    registry-fetch-interval-seconds: 3

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
